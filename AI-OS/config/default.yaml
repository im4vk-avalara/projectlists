# AIOS Default Configuration
# Paper Reference: Various sections

# Kernel Settings
kernel:
  host: "0.0.0.0"
  port: 8000
  log_level: "INFO"

# LLM Core Configuration (Section 3.1, Figure 2)
# Available backends: alfa, openai, mock
llm_cores:
  # Alfa (LLM Proxy) - Recommended for users
  - name: "core-0"
    backend: "alfa"
    model: "claude-4-sonnet"  # Options: claude-4-sonnet, gpt-5, gpt-4o, gpt-4o-mini
    alfa_env: "qa"  # Options: qa, prod
  # Uncomment for OpenAI direct access
  # - name: "core-1"
  #   backend: "openai"
  #   model: "gpt-4o-mini"
  #   max_tokens: 4096
  #   temperature: 0.7
  # Uncomment for mock testing
  # - name: "core-mock"
  #   backend: "mock"
  #   model: "mock-model"

# Scheduler Configuration (Section 3.3, Figure 3)
scheduler:
  strategy: "fifo"  # Options: fifo, round_robin
  round_robin:
    tokens_per_slice: 50
    max_time_ms: 500
  max_concurrent:
    llm: 1
    tool: 4
    memory: 8
    storage: 4

# Context Manager Configuration (Section 3.4, Figure 4)
context_manager:
  snapshot_type: "text"  # Options: text, logits
  max_snapshots_per_agent: 5
  snapshot_storage: "memory"  # Options: memory, disk

# Memory Manager Configuration (Section 3.5, Figure 5)
memory_manager:
  eviction_policy: "lru-k"
  lru_k_value: 2
  memory_limit_mb: 512
  swap_threshold_percent: 75
  background_swap_enabled: true

# Storage Manager Configuration (Section 3.6)
storage_manager:
  root_path: "./data/storage"
  vector_db:
    backend: "chroma"
    collection_name: "aios_storage"
  versioning:
    enabled: true
    max_versions: 10

# Tool Manager Configuration (Section 3.7)
tool_manager:
  default_max_instances: 4
  validation_enabled: true
  timeout_seconds: 30

# Access Manager Configuration (Section 3.8)
access_manager:
  default_privilege_level: "user"
  confirmation_handler: "cli"  # Options: cli, webhook, auto_approve
  confirmation_timeout_seconds: 60

