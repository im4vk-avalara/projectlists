# Common Pitfalls and Bugs by Technique
# Each pitfall has: description, symptom, fix, example

pitfalls:
  # ============ GENERAL ============
  integer_overflow:
    technique: "general"
    name: "Integer Overflow"
    description: "Intermediate calculations exceed int range"
    symptoms:
      - "Wrong answer on large inputs"
      - "Negative numbers appearing unexpectedly"
      - "Works on small tests, fails on large"
    when_occurs:
      - "Multiplying two large numbers"
      - "Sum of n large numbers"
      - "n * max_value > 2^31"
    fix: "Use 64-bit integers (long long in C++, just int in Python)"
    example: |
      # Bug: a * b might overflow
      result = a * b % MOD  # Wrong if a*b overflows
      # Fix: cast to long first
      result = (1 * a * b) % MOD  # Force 64-bit

  off_by_one:
    technique: "general"
    name: "Off-by-One Error"
    description: "Loop bounds or array indices wrong by 1"
    symptoms:
      - "Index out of bounds"
      - "Missing first or last element"
      - "Wrong answer by small margin"
    when_occurs:
      - "Array indexing (0-based vs 1-based)"
      - "Loop bounds (< vs <=)"
      - "Substring/range operations"
    fix: "Trace through with small example (n=1, n=2)"
    example: |
      # Bug: should be range(n), not range(n-1)
      for i in range(n-1):  # Misses last element
      # Fix:
      for i in range(n):

  uninitialized_values:
    technique: "general"
    name: "Uninitialized/Wrong Initial Values"
    description: "Variables not properly initialized"
    symptoms:
      - "Random wrong answers"
      - "Different results on repeated runs"
    when_occurs:
      - "DP arrays not reset between test cases"
      - "Min/max initial values wrong"
    fix: "Initialize explicitly, clear arrays for multiple test cases"
    example: |
      # Bug: min_val should start at infinity
      min_val = 0  # Wrong initial
      # Fix:
      min_val = float('inf')

  wrong_modulo:
    technique: "general"
    name: "Modulo Errors"
    description: "Incorrect modulo operations"
    symptoms:
      - "Negative numbers after modulo"
      - "Wrong answer on modulo problems"
    when_occurs:
      - "Subtraction under modulo"
      - "Forgetting to apply modulo"
    fix: "Use ((a - b) % MOD + MOD) % MOD for subtraction"
    example: |
      # Bug: (a - b) might be negative
      result = (a - b) % MOD  # Can be negative in some languages
      # Fix:
      result = ((a - b) % MOD + MOD) % MOD

  # ============ BINARY SEARCH ============
  binary_search_bounds:
    technique: "binary_search"
    name: "Wrong Binary Search Bounds"
    description: "lo/hi bounds don't cover all possibilities"
    symptoms:
      - "Misses optimal answer"
      - "Infinite loop"
      - "Wrong answer at boundaries"
    when_occurs:
      - "Answer could be 0 but lo starts at 1"
      - "Answer could be n but hi is n-1"
    fix: "Ensure [lo, hi] covers ALL possible answers"
    example: |
      # Bug: answer could be 0
      lo, hi = 1, n  # Misses 0
      # Fix:
      lo, hi = 0, n

  binary_search_mid_update:
    technique: "binary_search"
    name: "Wrong Mid Update"
    description: "Updating lo/hi incorrectly causes infinite loop or missed answer"
    symptoms:
      - "Infinite loop"
      - "Off-by-one in answer"
    when_occurs:
      - "lo = mid when should be lo = mid + 1"
      - "Condition check inverted"
    fix: "Use lo = mid + 1 or hi = mid - 1 to ensure progress"
    example: |
      # Bug: infinite loop when hi = lo + 1
      while lo < hi:
          mid = (lo + hi) // 2
          if check(mid):
              lo = mid  # Should be mid + 1 if check means "too small"

  binary_search_condition:
    technique: "binary_search"
    name: "Inverted Binary Search Condition"
    description: "Check function returns opposite of intended"
    symptoms:
      - "Returns wrong boundary"
      - "Finds maximum instead of minimum"
    when_occurs:
      - "Confusion about what condition means"
    fix: "Clearly define: check(x) = True means x is valid/feasible"

  # ============ DP ============
  dp_base_case:
    technique: "dp"
    name: "Wrong DP Base Case"
    description: "Base case initialization incorrect"
    symptoms:
      - "Wrong answer for small inputs"
      - "All answers off by fixed amount"
    when_occurs:
      - "dp[0] should be 0 or 1 or inf"
      - "Missing base case"
    fix: "Work through smallest examples by hand"
    example: |
      # Bug: coin change should have dp[0] = 0
      dp = [float('inf')] * (amount + 1)
      dp[0] = 0  # Don't forget this!

  dp_transition_order:
    technique: "dp"
    name: "Wrong DP Transition Order"
    description: "Processing states in wrong order"
    symptoms:
      - "Using states before they're computed"
      - "Works for some cases, wrong for others"
    when_occurs:
      - "0/1 vs unbounded knapsack confusion"
      - "Need reverse iteration but using forward"
    fix: "Draw dependency graph, ensure dependencies computed first"
    example: |
      # 0/1 knapsack: iterate capacity backwards
      for w in range(W, weight-1, -1):
          dp[w] = max(dp[w], dp[w-weight] + value)

  dp_state_missing:
    technique: "dp"
    name: "Missing DP State Dimension"
    description: "State doesn't capture all needed information"
    symptoms:
      - "Wrong answer, can't find correct recurrence"
    when_occurs:
      - "Need to track additional info (parity, last choice, etc.)"
    fix: "Add dimension to state for missing information"

  # ============ GRAPHS ============
  graph_visited_check:
    technique: "graph"
    name: "Missing/Late Visited Check"
    description: "Not marking nodes visited or checking too late"
    symptoms:
      - "TLE (Time Limit Exceeded)"
      - "Infinite loop"
      - "Stack overflow"
    when_occurs:
      - "BFS/DFS without visited array"
      - "Marking visited after adding to queue (BFS bug)"
    fix: "Mark visited WHEN adding to queue, not when processing"
    example: |
      # Bug: mark visited when processing
      while queue:
          node = queue.popleft()
          visited[node] = True  # Too late! Already added duplicates
      # Fix: mark when adding
      queue.append(start)
      visited[start] = True
      while queue:
          node = queue.popleft()
          for neighbor in adj[node]:
              if not visited[neighbor]:
                  visited[neighbor] = True  # Before adding
                  queue.append(neighbor)

  graph_0_vs_1_indexed:
    technique: "graph"
    name: "0-indexed vs 1-indexed Graph"
    description: "Mixing node numbering conventions"
    symptoms:
      - "Index out of bounds"
      - "Missing edges"
      - "Wrong node processed"
    when_occurs:
      - "Input is 1-indexed, code is 0-indexed"
    fix: "Convert consistently: either subtract 1 from input or use 1-indexed arrays"

  dijkstra_negative_weights:
    technique: "dijkstra"
    name: "Using Dijkstra with Negative Weights"
    description: "Dijkstra doesn't work with negative edge weights"
    symptoms:
      - "Wrong shortest path"
    when_occurs:
      - "Graph has negative weights"
    fix: "Use Bellman-Ford or SPFA for negative weights"

  # ============ DATA STRUCTURES ============
  segment_tree_lazy:
    technique: "segment_tree"
    name: "Lazy Propagation Bug"
    description: "Not pushing lazy updates before accessing children"
    symptoms:
      - "Range updates give wrong query results"
    when_occurs:
      - "Range update + query operations mixed"
    fix: "Always push_down before recursing to children"

  dsu_wrong_find:
    technique: "union_find"
    name: "DSU Find Without Path Compression"
    description: "Find operation too slow or incorrect"
    symptoms:
      - "TLE on many operations"
      - "Incorrect grouping"
    when_occurs:
      - "Missing path compression"
      - "Not using find() in union"
    fix: "Always use find() to get root, apply path compression"
    example: |
      def find(x):
          if parent[x] != x:
              parent[x] = find(parent[x])  # Path compression
          return parent[x]

  # ============ GREEDY ============
  greedy_not_optimal:
    technique: "greedy"
    name: "Greedy Choice Not Actually Optimal"
    description: "Greedy approach seems right but isn't provably optimal"
    symptoms:
      - "Works on samples, fails on hidden tests"
      - "Counter-examples exist"
    when_occurs:
      - "Problem requires DP but greedy attempted"
    fix: "Prove greedy works (exchange argument) or use DP"

  greedy_tie_breaking:
    technique: "greedy"
    name: "Wrong Tie-Breaking in Greedy"
    description: "When values are equal, wrong choice is made"
    symptoms:
      - "Wrong on specific edge cases"
    when_occurs:
      - "Multiple elements with same priority"
    fix: "Define clear secondary sort criteria"

  # ============ I/O ============
  slow_io:
    technique: "io"
    name: "Slow I/O Causing TLE"
    description: "Standard I/O too slow for large inputs"
    symptoms:
      - "TLE even with correct O(n) algorithm"
    when_occurs:
      - "n >= 10^5 with line-by-line I/O"
    fix: "Use fast I/O: sys.stdin.read() in Python, ios_base::sync_with_stdio(false) in C++"
    example: |
      # Python fast I/O
      import sys
      input = sys.stdin.readline
      # Or read all at once:
      data = sys.stdin.read().split()

  output_format:
    technique: "io"
    name: "Wrong Output Format"
    description: "Output format doesn't match expected"
    symptoms:
      - "WA on all tests even with correct logic"
    when_occurs:
      - "YES/Yes/yes confusion"
      - "Missing newline"
      - "Extra spaces"
    fix: "Match output format exactly as shown in examples"

