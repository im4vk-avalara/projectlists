# Competitive Programming Technique Cards
# Each technique has: description, patterns, complexity, when_to_use, related_problems

techniques:
  # ============ SORTING & SEARCHING ============
  binary_search:
    name: "Binary Search"
    category: "searching"
    description: "Divide search space in half each iteration to find target or optimal value"
    patterns:
      - "find minimum/maximum value that satisfies condition"
      - "search in sorted array"
      - "find first/last occurrence"
      - "monotonic function optimization"
    complexity:
      time: "O(log n)"
      space: "O(1)"
    when_to_use:
      - "Array is sorted or can be sorted"
      - "Answer has monotonic property (if X works, all X+1 work OR all X-1 work)"
      - "Need to find boundary between valid/invalid"
      - "Minimize maximum or maximize minimum"
    key_insight: "If f(x) is monotonic, binary search finds the transition point"
    template: "binary_search.py"
    
  two_pointers:
    name: "Two Pointers"
    category: "searching"
    description: "Use two pointers moving in same or opposite directions"
    patterns:
      - "find pair with given sum in sorted array"
      - "remove duplicates in-place"
      - "merge two sorted arrays"
      - "sliding window variant"
    complexity:
      time: "O(n)"
      space: "O(1)"
    when_to_use:
      - "Array is sorted"
      - "Looking for pairs/subarrays with certain property"
      - "In-place modification needed"
    key_insight: "Sorted order lets you decide which pointer to move"
    template: "two_pointers.py"

  # ============ DYNAMIC PROGRAMMING ============
  dp_linear:
    name: "Linear DP"
    category: "dp"
    description: "DP where state depends on previous few states"
    patterns:
      - "count ways to reach position"
      - "minimum cost to reach end"
      - "longest increasing subsequence"
      - "house robber / non-adjacent selection"
    complexity:
      time: "O(n) or O(n²)"
      space: "O(n) or O(1) with optimization"
    when_to_use:
      - "Optimal substructure: solution depends on solutions to subproblems"
      - "Overlapping subproblems"
      - "State can be defined by position/index"
    key_insight: "Define state clearly, then find recurrence relation"
    template: "dp_linear.py"

  dp_knapsack:
    name: "Knapsack DP"
    category: "dp"
    description: "Select items with capacity/budget constraint"
    patterns:
      - "0/1 knapsack: take or leave items"
      - "unbounded knapsack: unlimited copies"
      - "subset sum"
      - "coin change"
    complexity:
      time: "O(n * W) where W is capacity"
      space: "O(W) with 1D optimization"
    when_to_use:
      - "Select subset of items"
      - "Capacity/budget constraint"
      - "Maximize value or count ways"
    key_insight: "dp[i][w] = best using first i items with capacity w"
    template: "dp_knapsack.py"

  dp_interval:
    name: "Interval DP"
    category: "dp"
    description: "DP over intervals/ranges [l, r]"
    patterns:
      - "matrix chain multiplication"
      - "optimal BST"
      - "merge stones"
      - "palindrome partitioning"
    complexity:
      time: "O(n³) typically"
      space: "O(n²)"
    when_to_use:
      - "Combining/merging adjacent elements"
      - "Cost depends on range [l, r]"
      - "Need to try all split points"
    key_insight: "dp[l][r] = min/max over all ways to split [l,r]"
    template: "dp_interval.py"

  dp_bitmask:
    name: "Bitmask DP"
    category: "dp"
    description: "Use bitmask to represent subset state"
    patterns:
      - "traveling salesman (TSP)"
      - "assign n people to n tasks"
      - "subset enumeration"
      - "Hamiltonian path"
    complexity:
      time: "O(2^n * n) or O(2^n * n²)"
      space: "O(2^n)"
    when_to_use:
      - "n ≤ 20 (small enough for 2^n)"
      - "Need to track which elements are used"
      - "Permutation-like problems"
    key_insight: "Each bit represents whether element is included"
    template: "dp_bitmask.py"

  dp_digit:
    name: "Digit DP"
    category: "dp"
    description: "Count numbers with certain digit properties in range [L, R]"
    patterns:
      - "count numbers with digit sum = K"
      - "count numbers without digit 4"
      - "count numbers divisible by K"
    complexity:
      time: "O(D * S * 2) where D=digits, S=states"
      space: "O(D * S)"
    when_to_use:
      - "Count integers in range [L, R] with property"
      - "Property depends on digits"
      - "Range too large to iterate"
    key_insight: "Track tight constraint + accumulated state"
    template: "dp_digit.py"

  # ============ GRAPH ALGORITHMS ============
  bfs:
    name: "Breadth-First Search"
    category: "graph"
    description: "Level-order traversal, shortest path in unweighted graphs"
    patterns:
      - "shortest path unweighted"
      - "level order traversal"
      - "find connected components"
      - "grid traversal"
    complexity:
      time: "O(V + E)"
      space: "O(V)"
    when_to_use:
      - "Unweighted graph shortest path"
      - "Need to explore by distance/level"
      - "Grid problems with obstacles"
    key_insight: "Queue ensures we process nodes in order of distance"
    template: "bfs.py"

  dfs:
    name: "Depth-First Search"
    category: "graph"
    description: "Explore as deep as possible before backtracking"
    patterns:
      - "detect cycle"
      - "topological sort"
      - "connected components"
      - "path finding"
    complexity:
      time: "O(V + E)"
      space: "O(V) for recursion stack"
    when_to_use:
      - "Need to explore all paths"
      - "Backtracking required"
      - "Tree/graph traversal"
    key_insight: "Stack (explicit or recursion) for backtracking"
    template: "dfs.py"

  dijkstra:
    name: "Dijkstra's Algorithm"
    category: "graph"
    description: "Shortest path in weighted graph with non-negative edges"
    patterns:
      - "shortest path weighted graph"
      - "minimum cost to reach destination"
    complexity:
      time: "O((V + E) log V) with heap"
      space: "O(V)"
    when_to_use:
      - "Weighted graph with non-negative weights"
      - "Single source shortest path"
    key_insight: "Greedy: always process minimum distance node next"
    template: "dijkstra.py"

  union_find:
    name: "Union-Find (DSU)"
    category: "graph"
    description: "Disjoint Set Union for dynamic connectivity"
    patterns:
      - "connected components dynamically"
      - "Kruskal's MST"
      - "detect cycle in undirected graph"
      - "group related elements"
    complexity:
      time: "O(α(n)) per operation ≈ O(1)"
      space: "O(n)"
    when_to_use:
      - "Need to merge sets"
      - "Query if two elements in same set"
      - "Dynamic connectivity"
    key_insight: "Path compression + union by rank for near O(1)"
    template: "union_find.py"

  # ============ DATA STRUCTURES ============
  segment_tree:
    name: "Segment Tree"
    category: "data_structure"
    description: "Tree for range queries and point/range updates"
    patterns:
      - "range sum/min/max query"
      - "range update"
      - "count elements in range"
    complexity:
      time: "O(log n) per query/update"
      space: "O(n)"
    when_to_use:
      - "Multiple range queries"
      - "Need updates between queries"
      - "Associative operation (sum, min, max, gcd)"
    key_insight: "Each node stores aggregate of its range"
    template: "segment_tree.py"

  fenwick_tree:
    name: "Fenwick Tree (BIT)"
    category: "data_structure"
    description: "Binary Indexed Tree for prefix operations"
    patterns:
      - "prefix sum with updates"
      - "count inversions"
      - "range sum queries"
    complexity:
      time: "O(log n) per operation"
      space: "O(n)"
    when_to_use:
      - "Prefix sums with point updates"
      - "Simpler than segment tree when applicable"
    key_insight: "Uses binary representation for efficient updates"
    template: "fenwick_tree.py"

  monotonic_stack:
    name: "Monotonic Stack"
    category: "data_structure"
    description: "Stack maintaining monotonic order"
    patterns:
      - "next greater element"
      - "previous smaller element"
      - "largest rectangle in histogram"
      - "trapping rain water"
    complexity:
      time: "O(n)"
      space: "O(n)"
    when_to_use:
      - "Need nearest larger/smaller element"
      - "Span problems"
      - "Histogram-like problems"
    key_insight: "Pop elements that violate monotonic property"
    template: "monotonic_stack.py"

  # ============ GREEDY ============
  greedy_interval:
    name: "Interval Greedy"
    category: "greedy"
    description: "Greedy selection of non-overlapping intervals"
    patterns:
      - "maximum non-overlapping intervals"
      - "minimum meeting rooms"
      - "activity selection"
    complexity:
      time: "O(n log n) for sorting"
      space: "O(1)"
    when_to_use:
      - "Interval scheduling"
      - "Can prove greedy choice is optimal"
    key_insight: "Sort by end time, greedily pick earliest ending"
    template: "greedy_interval.py"

  greedy_exchange:
    name: "Exchange Argument Greedy"
    category: "greedy"
    description: "Prove optimality by showing any swap makes it worse"
    patterns:
      - "job scheduling with deadlines"
      - "optimal ordering problems"
    complexity:
      time: "Usually O(n log n)"
      space: "O(1)"
    when_to_use:
      - "Need to prove greedy is optimal"
      - "Ordering/scheduling problems"
    key_insight: "Show that swapping any two elements doesn't improve"
    template: null

  # ============ NUMBER THEORY ============
  gcd_lcm:
    name: "GCD/LCM"
    category: "math"
    description: "Greatest Common Divisor and Least Common Multiple"
    patterns:
      - "find GCD of array"
      - "reduce fractions"
      - "LCM calculations"
    complexity:
      time: "O(log(min(a,b)))"
      space: "O(1)"
    when_to_use:
      - "Divisibility problems"
      - "Fraction operations"
    key_insight: "gcd(a,b) = gcd(b, a%b), lcm(a,b) = a*b/gcd(a,b)"
    template: "gcd_lcm.py"

  modular_arithmetic:
    name: "Modular Arithmetic"
    category: "math"
    description: "Operations under modulo, modular inverse"
    patterns:
      - "count with mod 10^9+7"
      - "modular exponentiation"
      - "modular inverse for division"
    complexity:
      time: "O(log p) for inverse"
      space: "O(1)"
    when_to_use:
      - "Answer required modulo prime"
      - "Large number calculations"
    key_insight: "a^(-1) mod p = a^(p-2) mod p (Fermat's little theorem)"
    template: "mod_arithmetic.py"

  prime_sieve:
    name: "Sieve of Eratosthenes"
    category: "math"
    description: "Find all primes up to N"
    patterns:
      - "prime factorization"
      - "count primes in range"
      - "smallest prime factor"
    complexity:
      time: "O(n log log n)"
      space: "O(n)"
    when_to_use:
      - "Need all primes up to N"
      - "Multiple prime queries"
    key_insight: "Mark multiples of each prime as composite"
    template: "prime_sieve.py"

  # ============ STRING ALGORITHMS ============
  string_hashing:
    name: "String Hashing"
    category: "string"
    description: "Polynomial hash for string comparison"
    patterns:
      - "substring comparison"
      - "count distinct substrings"
      - "pattern matching"
    complexity:
      time: "O(n) precompute, O(1) query"
      space: "O(n)"
    when_to_use:
      - "Multiple substring comparisons"
      - "Rabin-Karp pattern matching"
    key_insight: "Hash collision possible, use double hashing for safety"
    template: "string_hashing.py"

  kmp:
    name: "KMP Algorithm"
    category: "string"
    description: "Pattern matching with failure function"
    patterns:
      - "find pattern in text"
      - "count pattern occurrences"
      - "find period of string"
    complexity:
      time: "O(n + m)"
      space: "O(m)"
    when_to_use:
      - "Pattern matching"
      - "Need all occurrences"
    key_insight: "Failure function avoids re-comparing matched characters"
    template: "kmp.py"

